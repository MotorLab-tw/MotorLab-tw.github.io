name: Notify IndexNow on Push

# 觸發條件
on:
  # 1) 推送到 main 分支時自動執行
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'en/index.html'
      - 'ja/index.html'
      - 'guides/**/index.html'
      - 'en/guides/**/index.html'
      - 'ja/guides/**/index.html'
      - 'benchmarks/**/index.html'
      - 'en/benchmarks/**/index.html'
      - 'ja/benchmarks/**/index.html'
      - 'system/**/index.html'
      - 'en/system/**/index.html'
      - 'ja/system/**/index.html'
      - 'docs/**/index.html'
      - 'en/docs/**/index.html'
      - 'ja/docs/**/index.html'
      - 'knowledge_base/**/index.html'
      - 'en/knowledge_base/**/index.html'
      - 'ja/knowledge_base/**/index.html'
      - 'methodology/**/index.html'
      - 'en/methodology/**/index.html'
      - 'ja/methodology/**/index.html'
      # Hub 索引頁(D27,/{hub}/index.html)
      - 'guides/index.html'
      - 'en/guides/index.html'
      - 'ja/guides/index.html'
      - 'benchmarks/index.html'
      - 'en/benchmarks/index.html'
      - 'ja/benchmarks/index.html'
      - 'sitemap.xml'
      - '*.html'
      - '*.css'
      - '*.js'
      - '.github/workflows/indexnow.yml'
  
  # 2) 允許在 GitHub Actions 頁面手動觸發
  workflow_dispatch:

jobs:
  notify-indexnow:
    name: Send IndexNow Ping
    runs-on: ubuntu-latest

    steps:
      - name: Notify Bing IndexNow
        run: |
          KEY="${{ secrets.INDEXNOW_KEY }}"
          HOST="motorlab-tw.github.io"
          KEY_LOCATION="https://${HOST}/${KEY}.txt"
          
          echo "→ Sending IndexNow notification to Bing..."
          echo "→ Host: ${HOST}"
          echo "→ Key (first 8 chars): ${KEY:0:8}..."
          echo ""
          
          # POST JSON 方式提交三語 URL (Option 2 完整規範)
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "Host: api.indexnow.org" \
            -d "{
              \"host\": \"${HOST}\",
              \"key\": \"${KEY}\",
              \"keyLocation\": \"${KEY_LOCATION}\",
              \"urlList\": [
                \"https://${HOST}/\",
                \"https://${HOST}/en/\",
                \"https://${HOST}/ja/\",
                \"https://${HOST}/guides/\",
                \"https://${HOST}/en/guides/\",
                \"https://${HOST}/ja/guides/\",
                \"https://${HOST}/benchmarks/\",
                \"https://${HOST}/en/benchmarks/\",
                \"https://${HOST}/ja/benchmarks/\",
                \"https://${HOST}/methodology/\",
                \"https://${HOST}/en/methodology/\",
                \"https://${HOST}/ja/methodology/\",
                \"https://${HOST}/guides/motor-break-in-guide/\",
                \"https://${HOST}/guides/motor-break-in-mistakes/\",
                \"https://${HOST}/guides/tamiya-motor-specs/\",
                \"https://${HOST}/guides/motor-wash-vs-break-in/\",
                \"https://${HOST}/guides/racing-motor-break-in/\",
                \"https://${HOST}/guides/racing-prep-techniques/\",
                \"https://${HOST}/guides/motor-analysis-methodology/\",
                \"https://${HOST}/guides/motor-degradation-signs/\",
                \"https://${HOST}/benchmarks/tamiya-motor-full-lineup/\",
                \"https://${HOST}/en/guides/motor-break-in-guide/\",
                \"https://${HOST}/en/guides/motor-break-in-mistakes/\",
                \"https://${HOST}/en/guides/tamiya-motor-specs/\",
                \"https://${HOST}/en/guides/motor-wash-vs-break-in/\",
                \"https://${HOST}/en/guides/racing-motor-break-in/\",
                \"https://${HOST}/en/guides/racing-prep-techniques/\",
                \"https://${HOST}/en/guides/motor-analysis-methodology/\",
                \"https://${HOST}/en/guides/motor-degradation-signs/\",
                \"https://${HOST}/en/benchmarks/tamiya-motor-full-lineup/\",
                \"https://${HOST}/ja/guides/motor-break-in-guide/\",
                \"https://${HOST}/ja/guides/motor-break-in-mistakes/\",
                \"https://${HOST}/ja/guides/tamiya-motor-specs/\",
                \"https://${HOST}/ja/guides/motor-wash-vs-break-in/\",
                \"https://${HOST}/ja/guides/racing-motor-break-in/\",
                \"https://${HOST}/ja/guides/racing-prep-techniques/\",
                \"https://${HOST}/ja/guides/motor-analysis-methodology/\",
                \"https://${HOST}/ja/guides/motor-degradation-signs/\",
                \"https://${HOST}/ja/benchmarks/tamiya-motor-full-lineup/\"
              ]
            }")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "← HTTP Status: ${HTTP_CODE}"
          echo "← Response Body: ${BODY:-<empty>}"
          
          if [[ "$HTTP_CODE" == "200" || "$HTTP_CODE" == "202" ]]; then
            echo ""
            echo "✅ IndexNow notification sent successfully!"
            echo "✅ Bing will re-crawl all 3 language versions within minutes."
            exit 0
          else
            echo ""
            echo "❌ IndexNow notification failed."
            echo "❌ Check the response above for details."
            exit 1
          fi

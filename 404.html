<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — MotorLab.tw</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Microsoft JhengHei", sans-serif;
    background: #1a1d23;
    color: #eceff4;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(136, 192, 208, 0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(136, 192, 208, 0.025) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }
  .box {
    position: relative;
    z-index: 1;
    background: #2e3440;
    border: 1px solid #4c566a;
    border-radius: 10px;
    padding: 56px 48px;
    max-width: 520px;
    text-align: center;
  }
  .code {
    font-family: monospace;
    font-size: 14px;
    color: #bf616a;
    margin-bottom: 12px;
    letter-spacing: 0.1em;
  }
  h1 {
    font-size: 80px;
    color: #88c0d0;
    margin-bottom: 8px;
    font-weight: bold;
    line-height: 1;
  }
  h2 {
    font-size: 22px;
    margin-bottom: 16px;
  }
  p {
    color: #d8dee9;
    margin-bottom: 32px;
    line-height: 1.7;
  }
  .status {
    background: #1a1d23;
    border-left: 3px solid #bf616a;
    padding: 12px 16px;
    text-align: left;
    font-family: monospace;
    font-size: 13px;
    color: #bf616a;
    margin-bottom: 32px;
    border-radius: 4px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    background: #5e81ac;
    color: #eceff4;
    text-decoration: none;
    border-radius: 6px;
    font-size: 14px;
    transition: all 0.2s;
    border: 2px solid #5e81ac;
  }
  .btn:hover {
    background: #88c0d0;
    border-color: #88c0d0;
    color: #1a1d23;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="code">ERROR · 404</div>
    <h1>404</h1>
    <h2>找不到這個頁面</h2>
    <div class="status">● status: page_not_found · route does not exist</div>
    <p>你輸入的網址可能拼錯了，或這個頁面已被移除。<br>請回到首頁繼續瀏覽 MotorLab 的內容。</p>
    <a href="/" class="btn">← 回到首頁</a>
  </div>
</body>
</html>

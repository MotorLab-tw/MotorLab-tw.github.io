<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 背景：Nord 深色底 -->
  <rect width="64" height="64" rx="12" fill="#1a1d23"/>
  <!-- 外圈：北極藍 -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#88c0d0" stroke-width="4"/>
  <!-- 中心點：發光小圓 -->
  <circle cx="32" cy="32" r="6" fill="#88c0d0">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- 賽道刻度線 -->
  <line x1="32" y1="6" x2="32" y2="10" stroke="#88c0d0" stroke-width="2"/>
  <line x1="32" y1="54" x2="32" y2="58" stroke="#88c0d0" stroke-width="2"/>
  <line x1="6" y1="32" x2="10" y2="32" stroke="#88c0d0" stroke-width="2"/>
  <line x1="54" y1="32" x2="58" y2="32" stroke="#88c0d0" stroke-width="2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK TC','Noto Sans JP',sans-serif">
<rect x="1" y="1" width="858" height="468" rx="16" fill="#16191f" stroke="#2b313c" stroke-width="1.5"/>
<text x="32" y="46" fill="#35d0df" font-size="21" font-weight="700">Motor degradation decision (by RPM drop)</text>
<text x="30" y="86" fill="#98a2b3" font-size="13" font-weight="600" letter-spacing="1">RPM drop</text>
<text x="272" y="86" fill="#98a2b3" font-size="13" font-weight="600" letter-spacing="1">State</text>
<text x="462" y="86" fill="#98a2b3" font-size="13" font-weight="600" letter-spacing="1">Action</text>
<line x1="28" y1="98" x2="832" y2="98" stroke="#2b313c" stroke-width="1"/>
<rect x="16" y="110" width="828" height="66" rx="10" fill="#3ddc97" fill-opacity="0.08"/>
<rect x="20" y="118" width="5" height="50" rx="2.5" fill="#3ddc97"/>
<text x="40" y="145" fill="#e8ebf0" font-size="14.5" font-weight="700" dominant-baseline="middle">&lt; 5%</text>
<circle cx="278" cy="145" r="4.5" fill="#3ddc97"/>
<text x="292" y="145" fill="#cfd6e0" font-size="14" dominant-baseline="middle">Normal wear</text>
<text x="462" y="145" fill="#8ff0c4" font-size="14" font-weight="600" dominant-baseline="middle">Keep using</text>
<rect x="16" y="186" width="828" height="66" rx="10" fill="#f2c94c" fill-opacity="0.08"/>
<rect x="20" y="194" width="5" height="50" rx="2.5" fill="#f2c94c"/>
<text x="40" y="221" fill="#e8ebf0" font-size="14.5" font-weight="700" dominant-baseline="middle">5–10%</text>
<circle cx="278" cy="221" r="4.5" fill="#f2c94c"/>
<text x="292" y="221" fill="#cfd6e0" font-size="14" dominant-baseline="middle">Early degradation</text>
<text x="462" y="221" fill="#f6d97a" font-size="14" font-weight="600" dominant-baseline="middle">Wash + re-lubricate</text>
<rect x="16" y="262" width="828" height="66" rx="10" fill="#f2994a" fill-opacity="0.08"/>
<rect x="20" y="270" width="5" height="50" rx="2.5" fill="#f2994a"/>
<text x="40" y="297" fill="#e8ebf0" font-size="14.5" font-weight="700" dominant-baseline="middle">10–20%</text>
<circle cx="278" cy="297" r="4.5" fill="#f2994a"/>
<text x="292" y="297" fill="#cfd6e0" font-size="14" dominant-baseline="middle">Retirement candidate</text>
<text x="462" y="297" fill="#f7b579" font-size="14" font-weight="600" dominant-baseline="middle">Practice only, not races</text>
<rect x="16" y="338" width="828" height="66" rx="10" fill="#ff6b6b" fill-opacity="0.08"/>
<rect x="20" y="346" width="5" height="50" rx="2.5" fill="#ff6b6b"/>
<text x="40" y="373" fill="#e8ebf0" font-size="14.5" font-weight="700" dominant-baseline="middle">&gt; 20% / startup fail / overheat</text>
<circle cx="278" cy="373" r="4.5" fill="#ff6b6b"/>
<text x="292" y="373" fill="#cfd6e0" font-size="14" dominant-baseline="middle">Confirmed EoL</text>
<text x="462" y="373" fill="#ffb3b3" font-size="14" font-weight="600" dominant-baseline="middle">Retire</text>
<rect x="20" y="420" width="820" height="44" rx="8" fill="#12242a" stroke="#22323a" stroke-width="1"/>
<rect x="20" y="420" width="4" height="44" rx="2" fill="#35d0df"/>
<text x="36" y="447" fill="#a9d7de" font-size="13.5" font-weight="600">Build a baseline first, then map RPM drop to the action</text>
</svg>
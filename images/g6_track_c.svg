<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK TC','Noto Sans JP',sans-serif">
<rect x="1" y="1" width="878" height="458" rx="16" fill="#16191f" stroke="#2b313c" stroke-width="1.5"/>
<text x="32" y="46" fill="#35d0df" font-size="20" font-weight="700">跑道屬性 → 適合的馬達特性(源自 JCO 長期觀察)</text>
<text x="46" y="86" fill="#98a2b3" font-size="13" font-weight="600" letter-spacing="1">跑道類型</text>
<text x="452" y="86" fill="#98a2b3" font-size="13" font-weight="600" letter-spacing="1">適合馬達特性</text>
<line x1="28" y1="98" x2="852" y2="98" stroke="#2b313c" stroke-width="1"/>
<rect x="16" y="110" width="848" height="62" rx="10" fill="#35d0df" fill-opacity="0.07"/>
<circle cx="40" cy="145" r="6" fill="#35d0df"/>
<text x="56" y="145" fill="#e8ebf0" font-size="15" font-weight="700" dominant-baseline="middle">長直線多</text>
<text x="405" y="145" fill="#5b6472" font-size="18" dominant-baseline="middle">&#8594;</text>
<text x="440" y="145" fill="#8fe3ee" font-size="14.5" font-weight="600" dominant-baseline="middle">高 RPM、低扭力</text>
<rect x="16" y="184" width="848" height="62" rx="10" fill="#a78bfa" fill-opacity="0.07"/>
<circle cx="40" cy="219" r="6" fill="#a78bfa"/>
<text x="56" y="219" fill="#e8ebf0" font-size="15" font-weight="700" dominant-baseline="middle">連續彎道多</text>
<text x="405" y="219" fill="#5b6472" font-size="18" dominant-baseline="middle">&#8594;</text>
<text x="440" y="219" fill="#c9b8fb" font-size="14.5" font-weight="600" dominant-baseline="middle">中 RPM、高扭力</text>
<rect x="16" y="258" width="848" height="62" rx="10" fill="#f2994a" fill-opacity="0.07"/>
<circle cx="40" cy="293" r="6" fill="#f2994a"/>
<text x="56" y="293" fill="#e8ebf0" font-size="15" font-weight="700" dominant-baseline="middle">立體跳台</text>
<text x="405" y="293" fill="#5b6472" font-size="18" dominant-baseline="middle">&#8594;</text>
<text x="440" y="293" fill="#f7b579" font-size="14.5" font-weight="600" dominant-baseline="middle">高扭力、低 RPM 衝起跳</text>
<rect x="16" y="332" width="848" height="62" rx="10" fill="#3ddc97" fill-opacity="0.07"/>
<circle cx="40" cy="367" r="6" fill="#3ddc97"/>
<text x="56" y="367" fill="#e8ebf0" font-size="15" font-weight="700" dominant-baseline="middle">高速混合</text>
<text x="405" y="367" fill="#5b6472" font-size="18" dominant-baseline="middle">&#8594;</text>
<text x="440" y="367" fill="#8ff0c4" font-size="14.5" font-weight="600" dominant-baseline="middle">平衡型</text>
<rect x="20" y="414" width="840" height="44" rx="8" fill="#12242a" stroke="#22323a" stroke-width="1"/>
<rect x="20" y="414" width="4" height="44" rx="2" fill="#35d0df"/>
<text x="36" y="441" fill="#a9d7de" font-size="13" font-weight="600">重點:不是越快越好 —— 連續彎道用高轉速馬達,車身壓不住反而更慢</text>
</svg>
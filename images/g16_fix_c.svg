<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK TC','Noto Sans JP',sans-serif">
<rect x="1" y="1" width="798" height="518" rx="16" fill="#16191f" stroke="#2b313c" stroke-width="1.5"/>
<text x="32" y="46" fill="#35d0df" font-size="22" font-weight="700">馬達變慢:5 個原因 → 對策</text>
<text x="30" y="88" fill="#98a2b3" font-size="13" font-weight="600" letter-spacing="1">原因</text>
<text x="400" y="88" fill="#98a2b3" font-size="13" font-weight="600" letter-spacing="1" text-anchor="middle">判定</text>
<text x="478" y="88" fill="#98a2b3" font-size="13" font-weight="600" letter-spacing="1">對策</text>
<line x1="28" y1="100" x2="772" y2="100" stroke="#2b313c" stroke-width="1"/>
<rect x="24" y="124" width="4" height="44" rx="2" fill="#3ddc97"/>
<text x="40" y="150" fill="#e8ebf0" font-size="15" font-weight="600" dominant-baseline="middle">① 電池 / 供電不足</text>
<rect x="341" y="137" width="118" height="26" rx="13" fill="#13312655" stroke="#3ddc97" stroke-width="1.2"/>
<text x="400" y="150" fill="#6ee7b7" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle">可逆</text>
<text x="478" y="150" fill="#cfd6e0" font-size="13.5" dominant-baseline="middle">換一顆滿電、健康的電池</text>
<rect x="16" y="180" width="768" height="68" rx="8" fill="#1b1f27"/>
<rect x="24" y="192" width="4" height="44" rx="2" fill="#3ddc97"/>
<text x="40" y="218" fill="#e8ebf0" font-size="15" font-weight="600" dominant-baseline="middle">② 髒污 / 積碳</text>
<rect x="341" y="205" width="118" height="26" rx="13" fill="#13312655" stroke="#3ddc97" stroke-width="1.2"/>
<text x="400" y="218" fill="#6ee7b7" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle">可逆</text>
<text x="478" y="218" fill="#cfd6e0" font-size="13.5" dominant-baseline="middle">外部清潔沖洗(不可拆解)</text>
<rect x="24" y="260" width="4" height="44" rx="2" fill="#3ddc97"/>
<text x="40" y="286" fill="#e8ebf0" font-size="15" font-weight="600" dominant-baseline="middle">③ 軸承 / 潤滑劣化</text>
<rect x="341" y="273" width="118" height="26" rx="13" fill="#13312655" stroke="#3ddc97" stroke-width="1.2"/>
<text x="400" y="286" fill="#6ee7b7" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle">可逆</text>
<text x="478" y="286" fill="#cfd6e0" font-size="13.5" dominant-baseline="middle">軸承上油、清潔</text>
<rect x="16" y="316" width="768" height="68" rx="8" fill="#1b1f27"/>
<rect x="24" y="328" width="4" height="44" rx="2" fill="#ff6b6b"/>
<text x="40" y="354" fill="#e8ebf0" font-size="15" font-weight="600" dominant-baseline="middle">④ 過熱退磁</text>
<rect x="341" y="341" width="118" height="26" rx="13" fill="#33191955" stroke="#ff6b6b" stroke-width="1.2"/>
<text x="400" y="354" fill="#ffb3b3" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle">不可逆</text>
<text x="478" y="354" fill="#ffc9c9" font-size="13.5" dominant-baseline="middle">退役</text>
<rect x="24" y="396" width="4" height="44" rx="2" fill="#ff6b6b"/>
<text x="40" y="422" fill="#e8ebf0" font-size="15" font-weight="600" dominant-baseline="middle">⑤ 電刷 / 整流子磨損</text>
<rect x="341" y="409" width="118" height="26" rx="13" fill="#33191955" stroke="#ff6b6b" stroke-width="1.2"/>
<text x="400" y="422" fill="#ffb3b3" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle">不可逆</text>
<text x="478" y="422" fill="#ffc9c9" font-size="13.5" dominant-baseline="middle">退役</text>
<rect x="24" y="464" width="752" height="46" rx="8" fill="#12242a" stroke="#22323a" stroke-width="1"/>
<rect x="24" y="464" width="4" height="46" rx="2" fill="#35d0df"/>
<text x="40" y="492" fill="#a9d7de" font-size="13.5" font-weight="600">先排 ①②③(可逆);都排除還是慢 → 真衰退,用數據判退役</text>
</svg>